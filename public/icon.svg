<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="apg-cyan-blue" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="apg-blade-left" x1="8" y1="38" x2="24" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="apg-blade-right" x1="40" y1="38" x2="24" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="apg-pulse-wave" x1="12" y1="26" x2="36" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="apg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glass Frame with rounded corners -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="#0b0f19" stroke="url(#apg-cyan-blue)" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Left Ascending Apex Blade -->
  <path d="M24 7L10 37H17.5L24 21L30.5 37H38L24 7Z" fill="url(#apg-blade-left)" fill-opacity="0.15" />
  <path d="M24 7L10 37H16.5L24 19.5L24 7Z" fill="url(#apg-blade-left)" />
  
  <!-- Right Descending Apex Facet -->
  <path d="M24 7L24 19.5L31.5 37H38L24 7Z" fill="url(#apg-blade-right)" />
  
  <!-- Central Pulse Frequency Chevron -->
  <path d="M16 27L21 21L24 25L27 21L32 27" stroke="url(#apg-pulse-wave)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#apg-glow)" />
  
  <!-- Core Focal Quantum Node -->
  <circle cx="24" cy="25" r="2" fill="#ffffff" filter="url(#apg-glow)" />

  <!-- Sub-Horizon Line -->
  <line x1="13" y1="41" x2="35" y2="41" stroke="#354368" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="24" cy="41" r="1.5" fill="#00f2fe" />
</svg>
